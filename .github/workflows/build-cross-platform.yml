name: Build Cross Platform Packages

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional release version, for example 0.0.2. Leave empty to auto-increment the latest vX.Y.Z tag."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.25.0"
  NODE_VERSION: "20"
  WAILS_VERSION: "v2.12.0"
  NFPM_VERSION: "v2.46.3"
  APP_NAME: "helloworld"
  BIN_NAME: "wails"

jobs:
  prepare-release-meta:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_version }}" ]]; then
            VERSION="${{ github.event.inputs.release_version }}"
            TAG_NAME="v${VERSION}"
          else
            git fetch --tags --force
            LATEST_TAG="$(git tag -l 'v*' --sort=-version:refname | head -n 1)"

            if [[ -z "${LATEST_TAG}" ]]; then
              VERSION="0.0.1"
            elif [[ "${LATEST_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            else
              echo "Latest tag '${LATEST_TAG}' is not in vX.Y.Z format"
              exit 1
            fi

            TAG_NAME="v${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows
    needs: prepare-release-meta
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Detect npm cache directory
        id: windows-npm-cache-dir
        shell: bash
        run: |
          CACHE_DIR="$(npm config get cache)"
          echo "path=${CACHE_DIR}" >> "$GITHUB_OUTPUT"

      - name: Restore npm cache
        id: windows-npm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.windows-npm-cache-dir.outputs.path }}
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Restore Go modules cache
        id: windows-go-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build Windows executable and installer
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -clean -platform windows/amd64 -nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-artifacts
          path: |
            build/bin/*.exe
          if-no-files-found: error

      - name: Save npm cache
        if: always() && steps.windows-npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.windows-npm-cache-dir.outputs.path }}
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}

      - name: Save Go modules cache
        if: always() && steps.windows-go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}

  build-macos:
    name: Build macOS
    needs: prepare-release-meta
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore npm cache
        id: macos-npm-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Restore Go modules cache
        id: macos-go-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build macOS app bundle
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -clean -platform darwin/universal

      - name: Archive macOS app bundle
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/bin/${APP_NAME}.app" "build/bin/${APP_NAME}-macos-universal.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-artifacts
          path: |
            build/bin/${{ env.APP_NAME }}-macos-universal.zip
          if-no-files-found: error

      - name: Save npm cache
        if: always() && steps.macos-npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}

      - name: Save Go modules cache
        if: always() && steps.macos-go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}

  build-linux-deb:
    name: Build Linux Deb (${{ matrix.ubuntu }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "20.04"
            image: ubuntu:20.04
            arch: amd64
            runner: ubuntu-24.04
            webkit_dev_pkg: libwebkit2gtk-4.0-dev
            wails_tags: ""
          - ubuntu: "20.04"
            image: ubuntu:20.04
            arch: arm64
            runner: ubuntu-24.04-arm
            webkit_dev_pkg: libwebkit2gtk-4.0-dev
            wails_tags: ""
          - ubuntu: "22.04"
            image: ubuntu:22.04
            arch: amd64
            runner: ubuntu-24.04
            webkit_dev_pkg: libwebkit2gtk-4.0-dev
            wails_tags: ""
          - ubuntu: "22.04"
            image: ubuntu:22.04
            arch: arm64
            runner: ubuntu-24.04-arm
            webkit_dev_pkg: libwebkit2gtk-4.0-dev
            wails_tags: ""
          - ubuntu: "24.04"
            image: ubuntu:24.04
            arch: amd64
            runner: ubuntu-24.04
            webkit_dev_pkg: libwebkit2gtk-4.1-dev
            wails_tags: webkit2_41
          - ubuntu: "24.04"
            image: ubuntu:24.04
            arch: arm64
            runner: ubuntu-24.04-arm
            webkit_dev_pkg: libwebkit2gtk-4.1-dev
            wails_tags: webkit2_41
    needs: prepare-release-meta
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Compute package version
        shell: bash
        run: |
          VERSION="${{ needs.prepare-release-meta.outputs.version }}"
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PACKAGE_ARCH=${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Build Linux deb in target Ubuntu container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GO_VERSION="${GO_VERSION}" \
            -e NODE_VERSION="${NODE_VERSION}" \
            -e WAILS_VERSION="${WAILS_VERSION}" \
            -e NFPM_VERSION="${NFPM_VERSION}" \
            -e PACKAGE_VERSION="${PACKAGE_VERSION}" \
            -e PACKAGE_ARCH="${PACKAGE_ARCH}" \
            -e WAILS_BUILD_TAGS="${{ matrix.wails_tags }}" \
            -v "${PWD}:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y \
                ca-certificates \
                curl \
                git \
                gnupg \
                build-essential \
                pkg-config \
                libgtk-3-dev \
                ${{ matrix.webkit_dev_pkg }} \
                xz-utils

              case "${PACKAGE_ARCH}" in
                amd64) GO_ARCH="amd64" ;;
                arm64) GO_ARCH="arm64" ;;
                *)
                  echo "Unsupported build arch: ${PACKAGE_ARCH}"
                  exit 1
                  ;;
              esac

              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${GO_ARCH}.tar.gz" -o /tmp/go.tgz
              rm -rf /usr/local/go
              tar -C /usr/local -xzf /tmp/go.tgz

              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs

              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH="/root/go"
              export PATH="${GOPATH}/bin:${PATH}"

              npm ci --prefix frontend
              go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
              go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}

              if [ -n "${WAILS_BUILD_TAGS}" ]; then
                wails build -clean -platform "linux/${PACKAGE_ARCH}" -tags "${WAILS_BUILD_TAGS}"
              else
                wails build -clean -platform "linux/${PACKAGE_ARCH}"
              fi

              mkdir -p dist
              nfpm package \
                --packager deb \
                --config build/linux/nfpm.yaml \
                --target "dist/${APP_NAME}_${PACKAGE_VERSION}_ubuntu${{ matrix.ubuntu }}_${PACKAGE_ARCH}.deb"
            '

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb-artifacts-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: |
            dist/*_ubuntu${{ matrix.ubuntu }}_${{ matrix.arch }}.deb
          if-no-files-found: error

      - name: Upload Linux binary artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-bin-artifacts-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: |
            build/bin/${{ env.BIN_NAME }}
          if-no-files-found: error

  publish-release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs:
      - prepare-release-meta
      - build-windows
      - build-macos
      - build-linux-deb
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: windows-artifacts
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          name: macos-artifacts
          path: release-assets/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: linux-deb-artifacts-*
          merge-multiple: false
          path: release-assets/linux

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release-meta.outputs.tag_name }}
          name: ${{ needs.prepare-release-meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/windows/**/*.exe
            release-assets/macos/**/*.zip
            release-assets/linux/**/*.deb
