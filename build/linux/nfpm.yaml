name: helloworld
arch: ${PACKAGE_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
section: utils
priority: optional
maintainer: 李佳龙 <1098955770@qq.com>
description: Wails desktop application built with Vue 3 and Go
homepage: https://github.com/${GITHUB_REPOSITORY}
license: Proprietary

contents:
  - src: ./build/bin/wails
    dst: /opt/helloworld/wails
    file_info:
      mode: 0755

  - src: ./build/linux/helloworld.desktop
    dst: /usr/share/applications/helloworld.desktop
    file_info:
      mode: 0644

  - src: ./build/appicon.png
    dst: /usr/share/pixmaps/helloworld.png
    file_info:
      mode: 0644
